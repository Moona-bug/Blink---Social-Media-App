{% extends 'base.html' %}

{% block title %}Log-in{% endblock title %}

{% block content %}
    <h2>Welcome Back!</h2>
    <form action="" method="post">

        {% csrf_token %}
        {{ form.as_p}}

        <button class="btn btn-primary" type="submit">Login</button>

        <p>Don't have an account? <a href="{% url 'signup' %}">Signup</a></p>
    </form>

{% endblock content %}
