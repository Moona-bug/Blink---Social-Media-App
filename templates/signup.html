<!-- Form to signup -->
{% extends 'base.html' %}

{% block title %}Sign-Up{% endblock title %}

{% block content %}
<div>
    <h2>Sign Up</h2>
    <form action="" method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Sign Up</button>

        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </form>
</div>
{% endblock content %}
