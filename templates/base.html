 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Icons -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>{% block title %}Blink{% endblock title %}</title>

     <style>
        .sidebar {
            width: 200px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            background-color: #212529;
        }
        .sidebar h3{
            padding-left: 20px;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

    </style>
 </head>
 <body class="bg-black text-white">
    <nav class="sidebar">
        <h3>
            <a class="text-white mb-4 d-block text-decoration-none" href="{% url 'home' %}">Blink</a>

        </h3>

      <ul class="nav flex-column">
         <li>
            <a class="nav-link text-white text-decoration-none" href="{% url 'home' %}">
               <i class="bi bi-house "></i>
               Home
            </a>
         </li>

         <li>
            <a class="nav-link text-white text-decoration-none" href="{% url 'post_new' %}">
                <i class="bi bi-plus-lg"></i>
            Post
            </a>
         </li>

         {% if user.is_authenticated %}
         <a class="nav-link text-green text-decoration-none" href="{% url 'profile' user.pk %}">{{ user.username }}</a>

         <li>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Sign-out</button>
            </form>
        </li>

         {% else %}
        <li>
            <a class="btn btn-primary" href="{% url 'login' %}">Login</a>
            <a class="btn btn-primary" href="{% url 'signup' %}">Signup</a>
        </li>
        {% endif %}

      </ul>
    </nav>

    <main class="main-content">

      {%block content %}
    
      {%endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

 </body>
 </html>
